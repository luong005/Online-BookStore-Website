spring.config.import=optional:file:.env[.properties]

spring.application.name=bookshop
server.port = 8082

spring.datasource.url = ${SPRING_DATASOURCE_URL}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto = update
logging.level.org.springframework.security=DEBUG

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500,http://localhost:5173,https://cb685f6c.online-bookstore-website.pages.dev}
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:None}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans = true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.prefix = api
jwt.expiration = 2592000
jwt.secretKey = ${JWT_SECRET_KEY}

payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.log-level=NONE

# Seed du lieu mau lon. Mac dinh tat de tranh anh huong du lieu hien tai.
app.seed.enabled=false
app.seed.clear-existing=false
app.seed.admin-count=5
app.seed.user-count=1200
app.seed.author-count=120
app.seed.category-count=30
app.seed.publisher-count=50
app.seed.book-count=3500
app.seed.order-count=2500
app.seed.refresh-token-count=1000
app.seed.max-cart-items-per-cart=5
app.seed.max-order-items-per-order=4
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD}
app.seed.user-password=${APP_SEED_USER_PASSWORD}
